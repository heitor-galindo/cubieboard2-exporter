name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        run: go test -v ./...

      - name: Build
        run: GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o cubieboard2-exporter .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: cubieboard2-exporter
          generate_release_notes: true